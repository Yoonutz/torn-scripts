name: bump-userscript-versions

# Bumps `// @version` in every userscript a push modifies, so Greasy Fork and the script managers
# pick the change up. A push that already changes @version by hand is left as it is.
on:
  push:
    branches: [main]
    paths:
      - "**/*.user.js"

concurrency:
  group: bump-userscript-versions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump @version of changed userscripts
        run: node .github/scripts/bump-userscript-versions.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump userscript version"
          git pull --rebase origin main
          git push origin HEAD:main
