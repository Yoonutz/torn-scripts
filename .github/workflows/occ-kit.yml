name: occ-kit

# Built userscripts are committed (Greasy Fork syncs the raw files), so every push checks that
# each .user.js still matches its sources, and runs the kit and runner tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node occ-kit/build.mjs --check
      - run: node --test occ-kit/tests/kit.test.mjs "Operational Command Center/worker/test/runner.test.mjs"
