<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floating Space Rock</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(12, 15, 22, 0.72);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4f7fb;
      --muted: #aeb8c8;
      --hot: #ffb45c;
      --cold: #7dc7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .hud {
      position: fixed;
      left: clamp(16px, 4vw, 42px);
      top: clamp(16px, 4vw, 36px);
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 3vw, 2.25rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .readout {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .metric strong,
    .metric span {
      display: block;
      overflow-wrap: anywhere;
    }

    .metric strong {
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .metric span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .control-strip {
      position: fixed;
      left: 50%;
      bottom: clamp(16px, 4vw, 34px);
      display: flex;
      gap: 10px;
      align-items: center;
      width: min(520px, calc(100vw - 32px));
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    button {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--cold);
      outline-offset: 2px;
    }

    .slider {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .slider label {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--hot);
    }

    @media (max-width: 680px) {
      .hud {
        top: 12px;
        padding: 12px;
      }

      .readout {
        grid-template-columns: 1fr;
      }

      .metric {
        padding: 8px;
      }

      .control-strip {
        align-items: stretch;
      }

      .slider {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A floating rotating space rock in a starfield"></canvas>

  <section class="hud" aria-label="Space rock status">
    <h1>Space Rock</h1>
    <p>Procedural asteroid mass suspended in low gravity, slowly rolling under cold starlight.</p>
    <div class="readout">
      <div class="metric">
        <strong>Spin</strong>
        <span id="spinReadout">steady</span>
      </div>
      <div class="metric">
        <strong>Surface</strong>
        <span>cratered</span>
      </div>
      <div class="metric">
        <strong>Mass</strong>
        <span>unknown</span>
      </div>
    </div>
  </section>

  <div class="control-strip" aria-label="Space rock controls">
    <button id="pauseButton" type="button" title="Pause rotation" aria-label="Pause rotation">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M7 5h3v14H7zm7 0h3v14h-3z"/>
      </svg>
    </button>
    <div class="slider">
      <label for="speedRange">Rotation</label>
      <input id="speedRange" type="range" min="0" max="1.8" step="0.05" value="0.72" aria-label="Rotation speed">
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js";

    const canvas = document.querySelector("#scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070c, 0.045);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(0, 0.2, 7.5);

    const asteroidGroup = new THREE.Group();
    scene.add(asteroidGroup);

    const hash = (x, y, z) => {
      const value = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return value - Math.floor(value);
    };

    const noise3 = (x, y, z) => {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const zi = Math.floor(z);
      const xf = x - xi;
      const yf = y - yi;
      const zf = z - zi;
      const smooth = (t) => t * t * (3 - 2 * t);
      const u = smooth(xf);
      const v = smooth(yf);
      const w = smooth(zf);
      const lerp = (a, b, t) => a + (b - a) * t;

      const x00 = lerp(hash(xi, yi, zi), hash(xi + 1, yi, zi), u);
      const x10 = lerp(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u);
      const x01 = lerp(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u);
      const x11 = lerp(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u);
      const y0 = lerp(x00, x10, v);
      const y1 = lerp(x01, x11, v);

      return lerp(y0, y1, w);
    };

    const layeredNoise = (x, y, z) => {
      let amplitude = 0.58;
      let frequency = 1.1;
      let total = 0;
      let divisor = 0;

      for (let i = 0; i < 5; i += 1) {
        total += noise3(x * frequency, y * frequency, z * frequency) * amplitude;
        divisor += amplitude;
        amplitude *= 0.54;
        frequency *= 2.08;
      }

      return total / divisor;
    };

    const craterCenters = [
      new THREE.Vector3(0.12, 0.9, 0.41).normalize(),
      new THREE.Vector3(-0.75, 0.25, 0.56).normalize(),
      new THREE.Vector3(0.8, -0.18, 0.4).normalize(),
      new THREE.Vector3(-0.18, -0.86, 0.52).normalize(),
      new THREE.Vector3(0.34, 0.1, -0.94).normalize(),
      new THREE.Vector3(-0.62, -0.56, -0.28).normalize(),
      new THREE.Vector3(0.9, 0.31, -0.1).normalize(),
    ];

    const geometry = new THREE.IcosahedronGeometry(1.7, 7);
    const position = geometry.attributes.position;
    const colors = [];
    const color = new THREE.Color();

    for (let i = 0; i < position.count; i += 1) {
      const vertex = new THREE.Vector3().fromBufferAttribute(position, i);
      const normal = vertex.clone().normalize();
      const baseNoise = layeredNoise(normal.x + 10, normal.y - 5, normal.z + 2);
      const ridgeNoise = layeredNoise(normal.x * 3.7 - 2, normal.y * 3.7 + 1, normal.z * 3.7);
      let radius = 1.32 + (baseNoise - 0.48) * 0.74 + (ridgeNoise - 0.5) * 0.24;
      let craterDarkening = 0;
      let craterRim = 0;

      for (const center of craterCenters) {
        const distance = normal.distanceTo(center);
        const depression = Math.max(0, 1 - distance / 0.28);
        const rim = Math.max(0, 1 - Math.abs(distance - 0.28) / 0.055);
        radius -= depression * depression * 0.22;
        radius += rim * 0.055;
        craterDarkening = Math.max(craterDarkening, depression);
        craterRim = Math.max(craterRim, rim);
      }

      vertex.copy(normal.multiplyScalar(radius));
      vertex.x *= 1.14;
      vertex.y *= 0.86;
      vertex.z *= 1.03;
      position.setXYZ(i, vertex.x, vertex.y, vertex.z);

      const shade = THREE.MathUtils.clamp(
        0.44 + baseNoise * 0.34 + ridgeNoise * 0.14 - craterDarkening * 0.24 + craterRim * 0.1,
        0,
        1
      );
      color.setRGB(shade * 0.95, shade * 0.88, shade * 0.78);
      colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.92,
      metalness: 0.04,
      flatShading: false,
    });

    const asteroid = new THREE.Mesh(geometry, material);
    asteroid.rotation.set(-0.25, 0.45, 0.1);
    asteroidGroup.add(asteroid);

    const dustMaterial = new THREE.PointsMaterial({
      color: 0xffd9a8,
      size: 0.021,
      transparent: true,
      opacity: 0.52,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = [];

    for (let i = 0; i < 260; i += 1) {
      const angle = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * 1.5;
      const ring = 2.05 + Math.random() * 0.9;
      dustPositions.push(Math.cos(angle) * ring, height, Math.sin(angle) * ring * 0.5);
    }

    dustGeometry.setAttribute("position", new THREE.Float32BufferAttribute(dustPositions, 3));
    const dust = new THREE.Points(dustGeometry, dustMaterial);
    dust.rotation.x = 0.18;
    asteroidGroup.add(dust);

    const starsGeometry = new THREE.BufferGeometry();
    const starPositions = [];
    const starColors = [];

    for (let i = 0; i < 1200; i += 1) {
      const radius = 28 + Math.random() * 42;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions.push(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );

      const starTint = new THREE.Color().setHSL(0.58 + Math.random() * 0.12, 0.42, 0.72 + Math.random() * 0.22);
      starColors.push(starTint.r, starTint.g, starTint.b);
    }

    starsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    starsGeometry.setAttribute("color", new THREE.Float32BufferAttribute(starColors, 3));

    const stars = new THREE.Points(
      starsGeometry,
      new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        transparent: true,
        opacity: 0.78,
        depthWrite: false,
      })
    );
    scene.add(stars);

    const keyLight = new THREE.DirectionalLight(0xffc784, 3.6);
    keyLight.position.set(4, 2.2, 3);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x79c3ff, 2.5);
    rimLight.position.set(-4.5, -0.4, -2.4);
    scene.add(rimLight);

    const fillLight = new THREE.HemisphereLight(0x5b7aff, 0x17110c, 0.55);
    scene.add(fillLight);

    const clock = new THREE.Clock();
    const speedRange = document.querySelector("#speedRange");
    const pauseButton = document.querySelector("#pauseButton");
    const spinReadout = document.querySelector("#spinReadout");
    let paused = false;
    const layout = {
      baseX: 0,
      baseY: 0,
      floatAmount: 0.25,
    };

    const setPauseIcon = () => {
      pauseButton.title = paused ? "Resume rotation" : "Pause rotation";
      pauseButton.setAttribute("aria-label", pauseButton.title);
      pauseButton.innerHTML = paused
        ? '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m8 5 11 7-11 7z"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg>';
    };

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      setPauseIcon();
    });

    const resize = () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      const compact = width < 680;
      camera.position.z = compact ? 10.8 : 7.5;
      asteroidGroup.scale.setScalar(compact ? 0.74 : 1);
      layout.baseX = compact ? 0 : 0;
      layout.baseY = compact ? -1.25 : 0;
      layout.floatAmount = compact ? 0.16 : 0.25;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    };

    window.addEventListener("resize", resize);
    resize();

    const pointer = new THREE.Vector2();
    window.addEventListener("pointermove", (event) => {
      pointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (event.clientY / window.innerHeight - 0.5) * 2;
    });

    const animate = () => {
      const elapsed = clock.getElapsedTime();
      const speed = Number(speedRange.value);
      spinReadout.textContent = speed < 0.2 ? "slow" : speed > 1.15 ? "fast" : "steady";

      if (!paused) {
        asteroid.rotation.y += 0.009 * speed;
        asteroid.rotation.x += 0.0038 * speed;
        asteroidGroup.rotation.z += 0.0016 * speed;
        dust.rotation.y -= 0.004 * speed;
      }

      asteroidGroup.position.y = layout.baseY + Math.sin(elapsed * 1.24) * layout.floatAmount;
      asteroidGroup.position.x = layout.baseX + Math.sin(elapsed * 0.56) * 0.12;
      asteroidGroup.rotation.x += (pointer.y * 0.14 - asteroidGroup.rotation.x) * 0.025;
      asteroidGroup.rotation.y += (pointer.x * 0.18 - asteroidGroup.rotation.y) * 0.025;
      stars.rotation.y += 0.00035;
      stars.rotation.x = Math.sin(elapsed * 0.08) * 0.035;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    };

    setPauseIcon();
    animate();
  </script>
</body>
</html>
